spring.config.import=optional:file:.env[.properties]

spring.application.name=clase
server.port=8082

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# URL base del microservicio de Entrenador (otro Bounded Context).
# Se usa para validar, vía REST, que el entrenador asignado a una clase existe.
#
# IMPORTANTE: microservicio-entrenadores no define server.port en su
# application.properties, así que por defecto levanta en el puerto 8080,
# el mismo que ya usa miembros. Para la demo, el equipo de Entrenador debe
# agregar "server.port=8083" a su application.properties (dejando 8080=miembros,
# 8081=equipo, 8082=clase, 8083=entrenador). Si usan otro puerto, ajustar aquí.
entrenador.service.url=http://localhost:8083

# Seguridad: JWT emitido por Keycloak (realm gimnasio)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/gimnasio

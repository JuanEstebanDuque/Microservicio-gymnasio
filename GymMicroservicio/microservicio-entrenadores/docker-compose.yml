services:
  postgres-gimnasio:
    image: postgres:16-alpine
    container_name: postgres-gimnasio
    restart: unless-stopped
    environment:
      POSTGRES_DB: gimnasio_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - gimnasio_pgdata:/var/lib/postgresql/data

volumes:
  gimnasio_pgdata:
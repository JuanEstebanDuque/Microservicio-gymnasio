server:
  port: 8090

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/gimnasio
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: miembros
              uri: lb://miembros
              predicates:
                - Path=/api/miembro/**,/api/pago/**,/api/entrenamiento/**
            - id: equipo
              uri: lb://equipo
              predicates:
                - Path=/api/equipo/**
            - id: clases
              uri: lb://clase
              predicates:
                - Path=/api/clase/**,/api/ocupacion/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
